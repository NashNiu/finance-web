# nginx site config for the 青账 H5 app (single-origin deployment).
# Serves the built frontend (dist/) and reverse-proxies /api to the backend.
#
# Install: copy to /etc/nginx/sites-available/finance, then
#   sudo ln -s /etc/nginx/sites-available/finance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace `your-domain.com` and the `root` path with your real values.

server {
    listen 80;
    server_name your-domain.com;

    # Where you copied the frontend build output (the contents of dist/).
    root /var/www/finance-web;
    index index.html;

    # Gzip text assets for faster loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static frontend. The app uses hash routing (/#/...), so a plain
    # try_files fallback to index.html is all that's needed.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy. NOTE: no trailing slash on proxy_pass — the original
    # URI (/api/...) is forwarded unchanged, matching the backend's /api prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# --- HTTPS ---
# Easiest path: install certbot and run
#   sudo certbot --nginx -d your-domain.com
# It will add the TLS listener (443), certificate paths, and an HTTP->HTTPS
# redirect to this server block automatically.
